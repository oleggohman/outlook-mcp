[package]
name = "hxprobe"
version = "0.2.4"
edition = "2021"
# `<[u8]>::as_chunks` (item.rs) is the newest std API in use.
rust-version = "1.88"

[dependencies]
memmap2 = "0.9"
memchr = "2"
# `bundled` compiles SQLite from source, so there is no dependency on whatever
# libsqlite3 happens to be installed.
rusqlite = { version = "0.32", features = ["bundled"] }
# JSON for the MCP server (`hxprobe mcp`): JSON-RPC framing and tool results.
serde_json = "1"
# flock() for the MCP cache build lock and getuid() for the cache directory
# ownership check. Already in the dependency tree through memmap2.
libc = "0.2"
# Inflate (deflate decompression) of ZIP entries, for the text of `.docx`,
# `.xlsx` and `.pptx` attachments. Pure Rust without `unsafe`; the archive
# and the XML are read by this crate's own code (`mcp/office.rs`).
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
# Text of PDF attachments. Runs only in the short-lived `hxprobe pdf-text`
# child, never inside the server; pinned with every package of its tree in
# Cargo.lock. It has no features and takes `lopdf` without its defaults.
pdf-extract = "=0.12.1"

[profile.release]
opt-level = 3
lto = true
